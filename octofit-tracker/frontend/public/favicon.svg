<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="#667eea" opacity="0.9"/>
  
  <!-- Outer ring -->
  <circle cx="50" cy="50" r="48" fill="none" stroke="#764ba2" stroke-width="2"/>
  
  <!-- Robot body outline -->
  <rect x="35" y="40" width="30" height="35" rx="3" fill="#00BCD4" stroke="#0D47A1" stroke-width="1.5"/>
  
  <!-- Robot eyes -->
  <circle cx="42" cy="48" r="4" fill="#1DE9B6"/>
  <circle cx="58" cy="48" r="4" fill="#1DE9B6"/>
  
  <!-- Robot smile -->
  <path d="M 42 58 Q 50 62 58 58" stroke="#0D47A1" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- Dumbbell (fitness element) -->
  <g transform="translate(50, 25)">
    <circle cx="-8" cy="0" r="3" fill="#FF6B6B"/>
    <rect x="-6" y="-2" width="12" height="4" fill="#FFD93D"/>
    <circle cx="8" cy="0" r="3" fill="#FF6B6B"/>
  </g>
  
  <!-- Heart (fitness/health element) -->
  <path d="M 65 35 Q 70 30 75 35 Q 75 40 70 45 Q 65 40 65 35" fill="#FF6B6B" opacity="0.8"/>
  
  <!-- Energy lines -->
  <line x1="20" y1="30" x2="25" y2="25" stroke="#FFD93D" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="20" y1="45" x2="22" y2="45" stroke="#FFD93D" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="20" y1="60" x2="25" y2="65" stroke="#FFD93D" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
</svg>